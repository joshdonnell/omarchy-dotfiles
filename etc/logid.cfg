// Hold the thumb gesture button and move left or right to switch workspace.
// The keys are Omarchy's Super + Shift + Tab (previous) and Super + Tab (next).
// logid matches a device by the name it prints after "Device found"; run `sudo logid -v` if a mouse is not picked up.

devices: (
  {
    name: "MX Master 3S";
    buttons: (
      {
        cid: 0xc3;
        action = {
          type: "Gestures";
          gestures: (
            {
              direction: "Left";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
            },
            {
              direction: "Right";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
            }
          );
        };
      }
    );
  },
  {
    name: "MX Master 3S for Mac";
    buttons: (
      {
        cid: 0xc3;
        action = {
          type: "Gestures";
          gestures: (
            {
              direction: "Left";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
            },
            {
              direction: "Right";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
            }
          );
        };
      }
    );
  },
  {
    name: "MX Master 3 for Mac";
    buttons: (
      {
        cid: 0xc3;
        action = {
          type: "Gestures";
          gestures: (
            {
              direction: "Left";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
            },
            {
              direction: "Right";
              mode: "OnRelease";
              action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
            }
          );
        };
      }
    );
  }
);
